# Dependency updates. Auto-merge rules: .github/workflows/dependabot-auto-merge.yml
# Weekly on Monday 06:00 Europe/Madrid, at most 5 open PRs per block.
# Cooldown 7 days (14 for majors) keeps fresh releases out.
# Groups take minor and patch updates. Majors get their own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    # GitHub Actions supports only `default-days`.
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7, semver-major-days: 14 }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
